</defs><rect width="1010" height="830" fill="#ffffff"/><rect width="1010" height="830" fill="url(#dots)"/>
<rect x="30.0" y="70.0" width="690.0" height="690.0" rx="16" fill="#eff6ff" fill-opacity="0.45" stroke="#2563eb" stroke-width="1.6"/>
<text x="46.0" y="91.0" text-anchor="start" font-size="12.0" font-weight="700" fill="#1d4ed8" opacity="1.00">① 外层 while —— 一轮对话（等你输入）</text>
<rect x="64.0" y="166.0" width="618.0" height="470.0" rx="16" fill="#ecfeff" fill-opacity="0.45" stroke="#0891b2" stroke-width="1.6"/>
<text x="80.0" y="187.0" text-anchor="start" font-size="12.0" font-weight="700" fill="#0e7490" opacity="1.00">② 内层 while —— 一次回答（问 AI → 干活 → 再问）</text>
<rect x="98.0" y="374.0" width="500.0" height="148.0" rx="16" fill="#ecfdf5" fill-opacity="0.45" stroke="#059669" stroke-width="1.6"/>
<text x="114.0" y="395.0" text-anchor="start" font-size="12.0" font-weight="700" fill="#047857" opacity="1.00">③ for block —— 本轮每个块</text>
