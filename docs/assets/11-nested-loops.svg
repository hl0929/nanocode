<text x="774.0" y="209.0" font-size="12.5" font-weight="700" fill="#0f172a">三层各管什么</text>
<text x="766.0" y="234.0" text-anchor="start" font-size="11.0" font-weight="600" fill="#334155" opacity="1.00">① 一次用户提问</text>
<text x="766.0" y="254.0" text-anchor="start" font-size="11.0" font-weight="400" fill="#475569" opacity="1.00">　　→ /q 退出</text>
