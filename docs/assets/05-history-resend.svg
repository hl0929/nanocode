<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 780" width="1010" height="780" role="img" aria-label="历史累积时序图：为什么每轮都要整个重发" style="background:#ffffff;max-width:100%;height:auto">
<title>历史累积时序图：为什么每轮都要整个重发</title><desc>三条消息被一遍遍全量重发；第二次请求里，第 1 条又被发了一次。</desc>
<style>
text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
.node rect.box, .node ellipse, .node polygon { filter: url(#soft); }
.flow { stroke-dasharray: 4 16; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}
</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.05" fill="#e2e8f0"/></pattern>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs><rect width="1010" height="780" fill="#ffffff"/><rect width="1010" height="780" fill="url(#dots)"/>
<g class="node"><rect class="box" x="34.0" y="56.0" width="152.0" height="44.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#soft)"/>
<text x="110.0" y="82.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d4ed8">你</text>
</g>
<line x1="110.0" y1="100.0" x2="110.0" y2="690.0" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 6" opacity=".45"/>
<g class="node"><rect class="box" x="324.0" y="56.0" width="152.0" height="44.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="400.0" y="82.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0e7490">程序</text>
</g>
<line x1="400.0" y1="100.0" x2="400.0" y2="690.0" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="4 6" opacity=".45"/>
<g class="node"><rect class="box" x="644.0" y="56.0" width="152.0" height="44.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
<text x="720.0" y="82.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6d28d9">AI（无状态）</text>
</g>
<line x1="720.0" y1="100.0" x2="720.0" y2="690.0" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 6" opacity=".45"/>
<marker id="arw-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<path d="M 110.0 160.0 L 400.0 160.0" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-user)"/>
<path d="M 110.0 160.0 L 400.0 160.0" fill="none" stroke="#eff6ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="134.0" cy="145.0" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="134.0" y="148.2" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">1</text>
<rect x="152.0" y="135.2" width="71.9" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="156.0" y="148.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#1d4ed8">有什么文件?</text>
<g class="node"><rect class="box" x="280.0" y="196.0" width="240.0" height="34.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="400.0" y="216.8" text-anchor="middle" font-size="11.0" font-weight="400" fill="#475569">messages = [① user]</text>
</g>
<marker id="arw-proc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
<path d="M 400.0 252.0 L 720.0 252.0" fill="none" stroke="#0891b2" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-proc)"/>
<path d="M 400.0 252.0 L 720.0 252.0" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="424.0" cy="237.0" r="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/><text x="424.0" y="240.2" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7490">2</text>
<rect x="442.0" y="227.2" width="32.4" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="446.0" y="240.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#0e7490">发 ①</text>
<marker id="arw-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<path d="M 720.0 312.0 L 400.0 312.0" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" stroke-dasharray="6 5" marker-end="url(#arw-ai)"/>
<circle cx="424.0" cy="297.0" r="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="424.0" y="300.2" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">3</text>
<rect x="442.0" y="287.2" width="104.6" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="446.0" y="300.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#6d28d9">text + tool_use</text>
<g class="node"><rect class="box" x="280.0" y="352.0" width="240.0" height="52.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="400.0" y="373.6" text-anchor="middle" font-size="11.0" font-weight="400" fill="#475569">执行 glob → "nanocode.py"</text>
<text x="400.0" y="390.1" text-anchor="middle" font-size="11.0" font-weight="400" fill="#475569">messages = [①, ②, ③]</text>
</g>
<path d="M 400.0 456.0 L 720.0 456.0" fill="none" stroke="#0891b2" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-proc)"/>
<path d="M 400.0 456.0 L 720.0 456.0" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="424.0" cy="441.0" r="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/><text x="424.0" y="444.2" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7490">4</text>
<rect x="442.0" y="431.2" width="114.3" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="446.0" y="444.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#0e7490">发 ①②③（整个重发）</text>
<rect x="772.0" y="236.0" width="210.0" height="128.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 5" fill-opacity="0.5"/>
<circle cx="786.0" cy="256.5" r="3.2" fill="#d97706"/>
<text x="796.0" y="261.0" font-size="12.5" font-weight="700" fill="#b45309">看清楚第 ④ 步</text>
<text x="788.0" y="280.0" text-anchor="start" font-size="11.0" font-weight="400" fill="#b45309" opacity="1.00">「发 ①②③」里，① 已经</text>
<text x="788.0" y="300.0" text-anchor="start" font-size="11.0" font-weight="400" fill="#b45309" opacity="1.00">是第二遍了 —— 上一轮发</text>
<text x="788.0" y="320.0" text-anchor="start" font-size="11.0" font-weight="400" fill="#b45309" opacity="1.00">过的历史，这一轮又原样</text>
<text x="788.0" y="340.0" text-anchor="start" font-size="11.0" font-weight="400" fill="#b45309" opacity="1.00">整个发了一次。</text>
<marker id="arw-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<path d="M 772.0 300.0 L 754.0 300.0 Q 742.0 300.0 742.0 312.0 L 742.0 446.0 Q 742.0 458.0 730.0 458.0 L 706.0 458.0" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-amber)"/>
<path d="M 720.0 560.0 L 400.0 560.0" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" stroke-dasharray="6 5" marker-end="url(#arw-ai)"/>
<circle cx="424.0" cy="545.0" r="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="424.0" y="548.2" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">5</text>
<rect x="442.0" y="535.2" width="143.7" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="446.0" y="548.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#6d28d9">只有 text（不再要工具）</text>
<g class="node"><rect class="box" x="280.0" y="600.0" width="240.0" height="34.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#soft)"/>
<text x="400.0" y="620.9" text-anchor="middle" font-size="11.0" font-weight="400" fill="#475569">打印回答 → 这轮结束</text>
</g>
<rect x="232" y="128" width="470" height="512" rx="16" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6" opacity=".75"/>
<rect x="363.0" y="650.2" width="214.1" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="470.0" y="663.9" text-anchor="middle" font-size="11.5" font-weight="500" fill="#b45309">虚线框 = 每轮都要全量重发的历史 ①②③</text>
<rect x="820.0" y="56.0" width="168.0" height="148.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 5" fill-opacity="0.5"/>
<circle cx="834.0" cy="76.5" r="3.2" fill="#dc2626"/>
<text x="844.0" y="81.0" font-size="12.5" font-weight="700" fill="#b91c1c">关键</text>
<text x="836.0" y="104.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#b91c1c" opacity="1.00">AI 那边没有记忆。</text>
<text x="836.0" y="126.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#b91c1c" opacity="1.00">每次调 API 对它都是</text>
<text x="836.0" y="148.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#b91c1c" opacity="1.00">「第一次见面」。</text>
<text x="836.0" y="176.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#b91c1c" opacity="1.00">不给全历史 = 完全失忆</text>
<rect x="820.0" y="620.0" width="168.0" height="92.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 5" fill-opacity="0.5"/>
<circle cx="834.0" cy="640.5" r="3.2" fill="#d97706"/>
<text x="844.0" y="645.0" font-size="12.5" font-weight="700" fill="#b45309">代价</text>
<text x="836.0" y="668.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#b45309" opacity="1.00">越聊越长、越慢越贵，</text>
<text x="836.0" y="688.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#b45309" opacity="1.00">最终撞上上下文上限。</text>
</svg>
