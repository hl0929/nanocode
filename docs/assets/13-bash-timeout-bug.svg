<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-label="bash 超时 bug 时序图" style="background:#ffffff;max-width:100%;height:auto">
<title>bash 超时 bug 时序图</title><desc>readline() 无限阻塞，proc.wait(timeout=30) 永远走不到 —— 实际等于没有超时。</desc>
<style>
text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
.node rect.box, .node ellipse, .node polygon { filter: url(#soft); }
.flow { stroke-dasharray: 4 16; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}
</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.05" fill="#e2e8f0"/></pattern>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs><rect width="980" height="620" fill="#ffffff"/><rect width="980" height="620" fill="url(#dots)"/>
<g class="node"><rect class="box" x="164.0" y="56.0" width="152.0" height="44.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="240.0" y="82.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0e7490">bash()</text>
</g>
<line x1="240.0" y1="100.0" x2="240.0" y2="430.0" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="4 6" opacity=".45"/>
<g class="node"><rect class="box" x="624.0" y="56.0" width="152.0" height="44.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="700.0" y="82.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#047857">子进程</text>
</g>
<line x1="700.0" y1="100.0" x2="700.0" y2="430.0" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 6" opacity=".45"/>
<g class="node"><rect class="box" x="150.0" y="116.0" width="180.0" height="34.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="240.0" y="137.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0e7490">Popen("sleep 100")</text>
</g>
<marker id="arw-proc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
<path d="M 330.0 133.0 L 700.0 133.0" fill="none" stroke="#0891b2" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-proc)"/>
<path d="M 330.0 133.0 L 700.0 133.0" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="352.0" cy="133.0" r="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/><text x="352.0" y="136.2" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7490">1</text>
<rect x="368.0" y="123.2" width="146.0" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="372.0" y="136.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#0e7490">启动，而且不产生任何输出</text>
<marker id="arw-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
<path d="M 240.0 196.0 L 700.0 196.0" fill="none" stroke="#dc2626" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" stroke-dasharray="6 5" marker-end="url(#arw-warn)"/>
<circle cx="262.0" cy="196.0" r="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><text x="262.0" y="199.2" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">2</text>
<rect x="278.0" y="186.2" width="159.3" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="282.0" y="199.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#b91c1c">readline() 在这里无限阻塞</text>
<rect x="140" y="222" width="560" height="76" rx="10" fill="#fef2f2" fill-opacity=".85" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="160.0" y="252.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c" opacity="1.00">代码卡死在这里 —— proc.wait(timeout=30) 永远走不到</text>
<text x="160.0" y="278.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#b91c1c" opacity="1.00">timeout 只作用在「等进程退出」，管不了「等一行输出」。</text>
<line x1="240" y1="318" x2="700" y2="318" stroke="#d97706" stroke-width="1.2" stroke-dasharray="2 7" opacity=".75"/>
<rect x="493.7" y="308.6" width="200.3" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="690.0" y="321.7" text-anchor="end" font-size="11.0" font-weight="500" fill="#b45309">第 30 秒 —— 本该在这里超时，但没有</text>
<marker id="arw-fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<path d="M 700.0 348.0 L 240.0 348.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" stroke-dasharray="6 5" marker-end="url(#arw-fs)"/>
<circle cx="678.0" cy="348.0" r="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><text x="678.0" y="351.2" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">3</text>
<rect x="356.4" y="338.2" width="305.6" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="658.0" y="351.9" text-anchor="end" font-size="11.5" font-weight="500" fill="#047857">100 秒后子进程结束，readline() 才返回空串 → break</text>
<g class="node"><rect class="box" x="150.0" y="380.0" width="180.0" height="36.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" filter="url(#soft)"/>
<text x="240.0" y="402.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">proc.wait(timeout=30)</text>
</g>
<rect x="344.0" y="388.2" width="279.4" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="348.0" y="401.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#334155">此时才轮到 wait()：进程早结束了 → 超时形同虚设</text>
<rect x="60.0" y="466.0" width="860.0" height="130.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 5" fill-opacity="0.5"/>
<circle cx="74.0" cy="486.5" r="3.2" fill="#dc2626"/>
<text x="84.0" y="491.0" font-size="12.5" font-weight="700" fill="#b91c1c">根本原因 &amp; 修法</text>
<text x="80.0" y="512.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#b91c1c" opacity="1.00">timeout 参数只作用在「等进程退出」上，管不了「等一行输出」；而 readline() 恰恰在等输出。</text>
<text x="80.0" y="544.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#b45309" opacity="1.00">方案 A：threading.Timer(30, proc.kill) 到点直接 kill，再 communicate() 阻塞读完。</text>
<text x="80.0" y="568.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#b45309" opacity="1.00">方案 B：把 readline 放进子线程，主线程 join(timeout=30)。</text>
</svg>
