<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="960" height="730" role="img" aria-label="工具统一契约图：六个工具的共同形状" style="background:#ffffff;max-width:100%;height:auto">
<title>工具统一契约图：六个工具的共同形状</title><desc>入参 dict → 出参 str；任何异常都在 run_tool 里被兜成字符串。</desc>
<style>
text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
.node rect.box, .node ellipse, .node polygon { filter: url(#soft); }
.flow { stroke-dasharray: 4 16; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}
</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.05" fill="#e2e8f0"/></pattern>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs><rect width="960" height="730" fill="#ffffff"/><rect width="960" height="730" fill="url(#dots)"/>
<g class="node"><rect class="box" x="40.0" y="100.0" width="330.0" height="68.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
<text x="56.0" y="128.6" text-anchor="start" font-size="13.5" font-weight="600" fill="#6d28d9">AI 说：想用 glob</text>
<text x="56.0" y="148.8" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">input = {"pat": "*.py"}</text>
</g>
<g class="node"><rect class="box" x="40.0" y="232.0" width="330.0" height="68.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="56.0" y="260.6" text-anchor="start" font-size="13.5" font-weight="600" fill="#0e7490">run_tool(name, args)</text>
<text x="56.0" y="280.9" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">try / except</text>
</g>
<marker id="arw-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<path d="M 205.0 168.0 L 205.0 232.0" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-ai)"/>
<path d="M 205.0 168.0 L 205.0 232.0" fill="none" stroke="#f5f3ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<rect x="218.0" y="194.2" width="110.6" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="222.0" y="207.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#6d28d9">① 入参是一个 dict</text>
<g class="node"><rect class="box" x="40.0" y="388.0" width="124.0" height="48.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="102.0" y="416.6" text-anchor="middle" font-size="13.0" font-weight="600" fill="#047857" class="mono">read()</text>
</g>
<g class="node"><rect class="box" x="178.0" y="388.0" width="124.0" height="48.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="240.0" y="416.6" text-anchor="middle" font-size="13.0" font-weight="600" fill="#047857" class="mono">write()</text>
</g>
<g class="node"><rect class="box" x="316.0" y="388.0" width="124.0" height="48.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="378.0" y="416.6" text-anchor="middle" font-size="13.0" font-weight="600" fill="#047857" class="mono">edit()</text>
</g>
<g class="node"><rect class="box" x="454.0" y="388.0" width="124.0" height="48.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="516.0" y="416.6" text-anchor="middle" font-size="13.0" font-weight="600" fill="#047857" class="mono">glob()</text>
</g>
<g class="node"><rect class="box" x="592.0" y="388.0" width="124.0" height="48.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="654.0" y="416.6" text-anchor="middle" font-size="13.0" font-weight="600" fill="#047857" class="mono">grep()</text>
</g>
<g class="node"><rect class="box" x="730.0" y="388.0" width="124.0" height="48.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="792.0" y="416.6" text-anchor="middle" font-size="13.0" font-weight="600" fill="#047857" class="mono">bash()</text>
</g>
<path d="M 205.0 300.0 L 205.0 352.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00"/>
<path d="M 102.0 352 L 792.0 352" stroke="#059669" stroke-width="1.6" stroke-linecap="round"/>
<marker id="arw-fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<path d="M 102.0 352.0 L 102.0 388.0" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 240.0 352.0 L 240.0 388.0" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 378.0 352.0 L 378.0 388.0" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 516.0 352.0 L 516.0 388.0" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 654.0 352.0 L 654.0 388.0" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 792.0 352.0 L 792.0 388.0" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<g class="node"><rect class="box" x="40.0" y="500.0" width="844.0" height="62.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="56.0" y="526.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#047857">统一返回一个字符串</text>
<text x="56.0" y="544.8" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">直接当 tool_result.content 喂回 AI</text>
</g>
<path d="M 102.0 436.0 L 102.0 500.0" fill="none" stroke="#059669" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" opacity="0.50" marker-end="url(#arw-fs)"/>
<path d="M 240.0 436.0 L 240.0 500.0" fill="none" stroke="#059669" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" opacity="0.50" marker-end="url(#arw-fs)"/>
<path d="M 378.0 436.0 L 378.0 500.0" fill="none" stroke="#059669" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" opacity="0.50" marker-end="url(#arw-fs)"/>
<path d="M 516.0 436.0 L 516.0 500.0" fill="none" stroke="#059669" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" opacity="0.50" marker-end="url(#arw-fs)"/>
<path d="M 654.0 436.0 L 654.0 500.0" fill="none" stroke="#059669" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" opacity="0.50" marker-end="url(#arw-fs)"/>
<path d="M 792.0 436.0 L 792.0 500.0" fill="none" stroke="#059669" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" opacity="0.50" marker-end="url(#arw-fs)"/>
<g class="node"><rect class="box" x="300.0" y="622.0" width="584.0" height="64.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#soft)"/>
<text x="316.0" y="648.6" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">error: No such file: xxx.py</text>
<text x="316.0" y="665.9" text-anchor="start" font-size="13.5" font-weight="400" fill="#475569">（失败也是一条字符串，同样喂回 AI）</text>
</g>
<marker id="arw-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
<path d="M 370.0 266.0 L 888.0 266.0 Q 900.0 266.0 900.0 278.0 L 900.0 646.0 Q 900.0 654.0 892.0 654.0 L 884.0 654.0" fill="none" stroke="#dc2626" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" stroke-dasharray="6 5" marker-end="url(#arw-warn)"/>
<path d="M 370.0 266.0 L 888.0 266.0 Q 900.0 266.0 900.0 278.0 L 900.0 646.0 Q 900.0 654.0 892.0 654.0 L 884.0 654.0" fill="none" stroke="#fef2f2" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<text x="912.0" y="463.9" text-anchor="middle" font-size="11.5" font-weight="500" fill="#b91c1c" transform="rotate(-90 912.0 460.0)">任何异常</text>
<text x="40.0" y="592.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569" opacity="1.00">六个工具形状完全一致：进去是参数，</text>
<text x="40.0" y="612.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569" opacity="1.00">出来是字符串，中间无论怎么炸，</text>
<text x="40.0" y="632.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569" opacity="1.00">都不会漏到外面。</text>
</svg>
