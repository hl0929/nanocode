<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 372" width="1060" height="372" role="img" aria-label="schema 转换流水线" style="background:#ffffff;max-width:100%;height:auto">
<title>schema 转换流水线</title><desc>TOOLS 里的一行紧凑写法，经过 4 站变成 API 认识的 JSON Schema。</desc>
<style>
text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
.node rect.box, .node ellipse, .node polygon { filter: url(#soft); }
.flow { stroke-dasharray: 4 16; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}
</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.05" fill="#e2e8f0"/></pattern>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs><rect width="1060" height="372" fill="#ffffff"/><rect width="1060" height="372" fill="url(#dots)"/>
<g class="node"><rect class="box" x="32.0" y="98.0" width="180.0" height="172.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="48.0" y="129.7" text-anchor="start" font-size="12.5" font-weight="600" fill="#0e7490">人写的紧凑格式</text>
<text x="48.0" y="151.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">"read": (</text>
<text x="48.0" y="169.9" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">  "Read file...",</text>
<text x="48.0" y="188.3" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">  {"path": "string",</text>
<text x="48.0" y="206.7" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">   "offset": "number?"},</text>
<text x="48.0" y="225.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">  read)</text>
</g>
<circle cx="48.0" cy="86.0" r="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/><text x="48.0" y="89.2" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7490">1</text>
<g class="node"><rect class="box" x="238.0" y="98.0" width="180.0" height="172.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="254.0" y="141.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0e7490">拆开三元组</text>
<text x="254.0" y="163.3" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">description</text>
<text x="254.0" y="181.7" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">params</text>
<text x="254.0" y="200.1" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">fn   ← 下标 [2]</text>
<text x="254.0" y="218.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono"></text>
</g>
<marker id="arw-proc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
<path d="M 212.0 184.0 L 238.0 184.0" fill="none" stroke="#0891b2" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-proc)"/>
<path d="M 212.0 184.0 L 238.0 184.0" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="254.0" cy="86.0" r="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/><text x="254.0" y="89.2" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7490">2</text>
<g class="node"><rect class="box" x="444.0" y="98.0" width="180.0" height="172.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="460.0" y="129.7" text-anchor="start" font-size="12.5" font-weight="600" fill="#047857">逐个参数处理</text>
<text x="460.0" y="151.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">number? → integer</text>
<text x="460.0" y="169.9" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">→ 不进 required</text>
<text x="460.0" y="188.3" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">string → string</text>
<text x="460.0" y="206.7" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">→ 进 required</text>
<text x="460.0" y="225.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono"></text>
</g>
<marker id="arw-fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<path d="M 418.0 184.0 L 444.0 184.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 418.0 184.0 L 444.0 184.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="460.0" cy="86.0" r="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><text x="460.0" y="89.2" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">3</text>
<g class="node"><rect class="box" x="650.0" y="98.0" width="180.0" height="172.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" filter="url(#soft)"/>
<text x="666.0" y="141.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#b45309">组装 input_schema</text>
<text x="666.0" y="163.3" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">type: object</text>
<text x="666.0" y="181.7" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">properties: {...}</text>
<text x="666.0" y="200.1" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">required: [path]</text>
<text x="666.0" y="218.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono"></text>
</g>
<marker id="arw-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<path d="M 624.0 184.0 L 650.0 184.0" fill="none" stroke="#d97706" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-amber)"/>
<path d="M 624.0 184.0 L 650.0 184.0" fill="none" stroke="#fffbeb" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="666.0" cy="86.0" r="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><text x="666.0" y="89.2" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">4</text>
<g class="node"><rect class="box" x="856.0" y="98.0" width="180.0" height="172.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
<text x="872.0" y="153.3" text-anchor="start" font-size="12.5" font-weight="600" fill="#6d28d9">塞进请求的 tools</text>
<text x="872.0" y="175.2" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">tools: [...]</text>
<text x="872.0" y="193.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">→ AI 读这份菜单</text>
<text x="872.0" y="211.9" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" class="mono">→ 决定调哪个工具</text>
</g>
<marker id="arw-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<path d="M 830.0 184.0 L 856.0 184.0" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-ai)"/>
<path d="M 830.0 184.0 L 856.0 184.0" fill="none" stroke="#f5f3ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="872.0" cy="86.0" r="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="872.0" y="89.2" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">5</text>
<rect x="32.0" y="292.0" width="986.0" height="62.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 5" fill-opacity="0.5"/>
<circle cx="46.0" cy="312.5" r="3.2" fill="#d97706"/>
<text x="56.0" y="317.0" font-size="12.5" font-weight="700" fill="#b45309">为什么要费这劲</text>
<text x="52.0" y="340.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#b45309" opacity="1.00">API 只认标准 JSON Schema，手写 6 个工具的 JSON 又长又易错；写小表自动转 —— 加新工具 = 一个函数 + 一行注册。</text>
</svg>
