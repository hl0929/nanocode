<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" role="img" aria-label="edit 唯一性判定决策树" style="background:#ffffff;max-width:100%;height:auto">
<title>edit 唯一性判定决策树</title><desc>只有一条路能走到「写文件」；两条 ❌ 虚线都是不动盘的报错路。</desc>
<style>
text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
.node rect.box, .node ellipse, .node polygon { filter: url(#soft); }
.flow { stroke-dasharray: 4 16; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}
</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.05" fill="#e2e8f0"/></pattern>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs><rect width="1100" height="720" fill="#ffffff"/><rect width="1100" height="720" fill="url(#dots)"/>
<g class="node"><rect class="box" x="420.0" y="44.0" width="280.0" height="48.0" rx="24" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="560.0" y="72.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0e7490">收到 {path, old, new, all?}</text>
</g>
<g class="node"><polygon class="box" points="560.0,112.0 680.0,168.0 560.0,224.0 440.0,168.0" fill="#ffffff" stroke="#64748b" stroke-width="1.6" filter="url(#soft)"/>
<text x="560.0" y="172.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">old 在文件里？</text>
</g>
<marker id="arw-proc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
<path d="M 560.0 92.0 L 560.0 112.0" fill="none" stroke="#0891b2" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-proc)"/>
<path d="M 560.0 92.0 L 560.0 112.0" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<g class="node"><rect class="box" x="740.0" y="140.0" width="320.0" height="56.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#soft)"/>
<text x="756.0" y="172.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#b91c1c">❌ error: old_string not found</text>
</g>
<marker id="arw-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
<path d="M 680.0 168.0 L 740.0 168.0" fill="none" stroke="#dc2626" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" stroke-dasharray="6 5" marker-end="url(#arw-warn)"/>
<rect x="689.5" y="140.7" width="41.0" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="710.0" y="153.7" text-anchor="middle" font-size="11.0" font-weight="500" fill="#b91c1c">找不到</text>
<marker id="arw-fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<path d="M 560.0 224.0 L 560.0 264.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 560.0 224.0 L 560.0 264.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<rect x="572.0" y="238.7" width="41.0" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="576.0" y="251.7" text-anchor="start" font-size="11.0" font-weight="500" fill="#047857">找到了</text>
<g class="node"><polygon class="box" points="560.0,266.0 672.0,318.0 560.0,370.0 448.0,318.0" fill="#ffffff" stroke="#64748b" stroke-width="1.6" filter="url(#soft)"/>
<text x="560.0" y="322.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">出现几次？</text>
</g>
<path d="M 448.0 318.0 L 382.0 318.0 Q 370.0 318.0 370.0 330.0 L 370.0 380.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 448.0 318.0 L 382.0 318.0 Q 370.0 318.0 370.0 330.0 L 370.0 380.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<rect x="388.0" y="292.6" width="75.3" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="392.0" y="305.7" text-anchor="start" font-size="11.0" font-weight="500" fill="#047857">1 次（唯一）</text>
<g class="node"><rect class="box" x="240.0" y="380.0" width="260.0" height="56.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="256.0" y="403.2" text-anchor="start" font-size="12.0" font-weight="600" fill="#047857">replace(old, new, 1)</text>
<text x="256.0" y="421.2" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">只换第一处</text>
</g>
<marker id="arw-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<path d="M 672.0 318.0 L 760.0 318.0" fill="none" stroke="#d97706" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-amber)"/>
<rect x="701.0" y="292.6" width="30.0" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="716.0" y="305.7" text-anchor="middle" font-size="11.0" font-weight="500" fill="#b45309">多次</text>
<g class="node"><polygon class="box" points="880.0,270.0 980.0,318.0 880.0,366.0 780.0,318.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" filter="url(#soft)"/>
<text x="880.0" y="322.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#b45309">all=true ?</text>
</g>
<path d="M 880.0 366.0 L 880.0 404.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 880.0 366.0 L 880.0 404.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<rect x="892.0" y="380.6" width="19.0" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="896.0" y="393.7" text-anchor="start" font-size="11.0" font-weight="500" fill="#047857">是</text>
<g class="node"><rect class="box" x="740.0" y="404.0" width="280.0" height="56.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="756.0" y="427.2" text-anchor="start" font-size="12.0" font-weight="600" fill="#047857">replace(old, new)</text>
<text x="756.0" y="445.2" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">全部替换</text>
</g>
<path d="M 980.0 318.0 L 1048.0 318.0 Q 1060.0 318.0 1060.0 330.0 L 1060.0 620.0 Q 1060.0 632.0 1048.0 632.0 L 1020.0 632.0" fill="none" stroke="#dc2626" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" stroke-dasharray="6 5" marker-end="url(#arw-warn)"/>
<rect x="1029.0" y="292.6" width="19.0" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="1044.0" y="305.7" text-anchor="end" font-size="11.0" font-weight="500" fill="#b91c1c">否</text>
<g class="node"><rect class="box" x="760.0" y="600.0" width="260.0" height="64.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#soft)"/>
<text x="776.0" y="627.6" text-anchor="start" font-size="11.0" font-weight="600" fill="#b91c1c">❌ error: appears N times</text>
<text x="776.0" y="644.1" text-anchor="start" font-size="11.0" font-weight="400" fill="#475569">必须唯一（use all=true）</text>
</g>
<g class="node"><rect class="box" x="300.0" y="600.0" width="320.0" height="58.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="460.0" y="633.5" text-anchor="middle" font-size="13.0" font-weight="600" fill="#047857">写回文件 → "ok"</text>
</g>
<path d="M 370.0 436.0 L 370.0 600.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 370.0 436.0 L 370.0 600.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<path d="M 740.0 432.0 L 712.0 432.0 Q 700.0 432.0 700.0 444.0 L 700.0 617.0 Q 700.0 629.0 688.0 629.0 L 620.0 629.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 740.0 432.0 L 712.0 432.0 Q 700.0 432.0 700.0 444.0 L 700.0 617.0 Q 700.0 629.0 688.0 629.0 L 620.0 629.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<rect x="634.0" y="466.6" width="52.0" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="660.0" y="479.7" text-anchor="middle" font-size="11.0" font-weight="500" fill="#047857">两条好路</text>
<rect x="617.5" y="486.6" width="85.0" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="660.0" y="499.7" text-anchor="middle" font-size="11.0" font-weight="500" fill="#047857">都汇到写回文件</text>
<rect x="40.0" y="470.0" width="230.0" height="210.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 5" fill-opacity="0.5"/>
<circle cx="54.0" cy="490.5" r="3.2" fill="#dc2626"/>
<text x="64.0" y="495.0" font-size="12.5" font-weight="700" fill="#b91c1c">两条 ❌ 死路</text>
<text x="58.0" y="522.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#b91c1c" opacity="1.00">宁可报错让 AI 重试，</text>
<text x="58.0" y="544.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#b91c1c" opacity="1.00">也绝不在「不确定改</text>
<text x="58.0" y="566.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#b91c1c" opacity="1.00">哪一处」的情况下写盘。</text>
<text x="58.0" y="598.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#64748b" opacity="1.00">这就是 edit 比 write</text>
<text x="58.0" y="620.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#64748b" opacity="1.00">安全的原因。</text>
</svg>
