<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="tool_use_id 叫号配对图" style="background:#ffffff;max-width:100%;height:auto">
<title>tool_use_id 叫号配对图</title><desc>AI 一口气提 3 个请求，程序回 3 条结果，顺序乱了也能靠 id 一一对上。</desc>
<style>
text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
.node rect.box, .node ellipse, .node polygon { filter: url(#soft); }
.flow { stroke-dasharray: 4 16; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}
</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.05" fill="#e2e8f0"/></pattern>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs><rect width="960" height="520" fill="#ffffff"/><rect width="960" height="520" fill="url(#dots)"/>
<text x="50.0" y="52.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#6d28d9" opacity="1.00">① AI 一口气提 3 个请求（同一轮）</text>
<text x="510.0" y="52.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#047857" opacity="1.00">② 程序回 3 条结果（顺序可以乱）</text>
<g class="node"><rect class="box" x="50.0" y="92.0" width="300.0" height="78.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
<text x="66.0" y="115.5" text-anchor="start" font-size="13.0" font-weight="600" fill="#6d28d9" class="mono">glob()</text>
<text x="66.0" y="135.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">id = toolu_A1</text>
<text x="66.0" y="152.2" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">input  *.py</text>
</g>
<g class="node"><rect class="box" x="50.0" y="204.0" width="300.0" height="78.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
<text x="66.0" y="227.5" text-anchor="start" font-size="13.0" font-weight="600" fill="#6d28d9" class="mono">read()</text>
<text x="66.0" y="247.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">id = toolu_A2</text>
<text x="66.0" y="264.2" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">input  main.py</text>
</g>
<g class="node"><rect class="box" x="50.0" y="316.0" width="300.0" height="78.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
<text x="66.0" y="339.5" text-anchor="start" font-size="13.0" font-weight="600" fill="#6d28d9" class="mono">bash()</text>
<text x="66.0" y="359.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">id = toolu_A3</text>
<text x="66.0" y="376.2" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">input  pytest</text>
</g>
<g class="node"><rect class="box" x="510.0" y="92.0" width="300.0" height="78.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="526.0" y="125.6" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">tool_use_id = toolu_A3</text>
<text x="526.0" y="142.8" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">content  3 passed</text>
</g>
<marker id="arw-fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<path d="M 350.0 355.0 L 510.0 131.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 350.0 355.0 L 510.0 131.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<g class="node"><rect class="box" x="510.0" y="204.0" width="300.0" height="78.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="526.0" y="237.6" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">tool_use_id = toolu_A1</text>
<text x="526.0" y="254.8" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">content  nanocode.py</text>
</g>
<path d="M 350.0 131.0 L 510.0 243.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 350.0 131.0 L 510.0 243.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<g class="node"><rect class="box" x="510.0" y="316.0" width="300.0" height="78.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="526.0" y="349.6" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">tool_use_id = toolu_A2</text>
<text x="526.0" y="366.9" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">content  import os...</text>
</g>
<path d="M 350.0 243.0 L 510.0 355.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 350.0 243.0 L 510.0 355.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<rect x="50.0" y="424.0" width="760.0" height="68.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 5" fill-opacity="0.5"/>
<circle cx="64.0" cy="444.5" r="3.2" fill="#d97706"/>
<text x="74.0" y="449.0" font-size="12.5" font-weight="700" fill="#b45309">为什么要编号</text>
<text x="70.0" y="472.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#b45309" opacity="1.00">就像食堂叫号取餐：不喊号的话，三份结果摆在那，谁都不敢拿。</text>
</svg>
