<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-label="三方关系：谁碰得到硬盘，谁碰不到" style="background:#ffffff;max-width:100%;height:auto">
<title>三方关系：谁碰得到硬盘，谁碰不到</title><desc>你说一句话，程序把全部历史发给云端 AI；AI 只能回 text / tool_use，真正执行的是本机程序。</desc>
<style>
text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
.node rect.box, .node ellipse, .node polygon { filter: url(#soft); }
.flow { stroke-dasharray: 4 16; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}
</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.05" fill="#e2e8f0"/></pattern>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs><rect width="940" height="560" fill="#ffffff"/><rect width="940" height="560" fill="url(#dots)"/>
<g class="node"><rect class="box" x="300.0" y="56.0" width="240.0" height="54.0" rx="27" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#soft)"/>
<text x="420.0" y="77.6" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d4ed8">你</text>
<text x="420.0" y="97.8" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569">键盘 / 屏幕</text>
</g>
<g class="node"><rect class="box" x="300.0" y="190.0" width="240.0" height="74.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="420.0" y="221.6" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0e7490">nanocode.py</text>
<text x="420.0" y="241.8" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569">本地进程（有手）</text>
</g>
<g class="node"><rect class="box" x="110.0" y="340.0" width="320.0" height="84.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
<text x="270.0" y="376.6" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6d28d9">AI 模型</text>
<text x="270.0" y="396.9" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569">云端（只有嘴）</text>
</g>
<g class="node"><rect class="box" x="480.0" y="340.0" width="320.0" height="84.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="640.0" y="376.6" text-anchor="middle" font-size="13.5" font-weight="600" fill="#047857">文件系统 + shell</text>
<text x="640.0" y="396.9" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569">本机（真的会动）</text>
</g>
<marker id="arw-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<path d="M 380.0 110.0 L 380.0 190.0" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-user)"/>
<path d="M 380.0 110.0 L 380.0 190.0" fill="none" stroke="#eff6ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<path d="M 460.0 190.0 L 460.0 110.0" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-user)"/>
<path d="M 460.0 190.0 L 460.0 110.0" fill="none" stroke="#eff6ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="380.0" cy="150.0" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="380.0" y="153.4" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">①</text>
<circle cx="460.0" cy="150.0" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="460.0" y="153.4" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">⑥</text>
<marker id="arw-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<path d="M 340.0 264.0 L 340.0 340.0" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-ai)"/>
<path d="M 340.0 264.0 L 340.0 340.0" fill="none" stroke="#f5f3ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<path d="M 240.0 340.0 L 240.0 264.0" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-ai)"/>
<path d="M 240.0 340.0 L 240.0 264.0" fill="none" stroke="#f5f3ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="340.0" cy="302.0" r="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="340.0" y="305.4" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">②</text>
<circle cx="240.0" cy="302.0" r="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="240.0" y="305.4" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">③</text>
<marker id="arw-fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<path d="M 560.0 264.0 L 560.0 340.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 560.0 264.0 L 560.0 340.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<path d="M 660.0 340.0 L 660.0 264.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 660.0 340.0 L 660.0 264.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<circle cx="560.0" cy="302.0" r="11" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><text x="560.0" y="305.4" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">④</text>
<circle cx="660.0" cy="302.0" r="11" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><text x="660.0" y="305.4" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">⑤</text>
<rect x="650.0" y="44.0" width="270.0" height="246.0" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 5" fill-opacity="0.5"/>
<circle cx="664.0" cy="64.5" r="3.2" fill="#64748b"/>
<text x="674.0" y="69.0" font-size="12.5" font-weight="700" fill="#0f172a">图例</text>
<circle cx="678.0" cy="92.0" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="678.0" y="95.2" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">①</text>
<text x="696.0" y="96.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#334155" opacity="1.00">你输入一句话</text>
<circle cx="678.0" cy="125.0" r="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="678.0" y="128.2" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">②</text>
<text x="696.0" y="129.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#334155" opacity="1.00">请求：全部历史 + 工具菜单</text>
<circle cx="678.0" cy="158.0" r="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="678.0" y="161.2" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">③</text>
<text x="696.0" y="162.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#334155" opacity="1.00">回复：text / tool_use（只说不做）</text>
<circle cx="678.0" cy="191.0" r="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><text x="678.0" y="194.2" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">④</text>
<text x="696.0" y="195.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#334155" opacity="1.00">程序真正执行工具</text>
<circle cx="678.0" cy="224.0" r="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><text x="678.0" y="227.2" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">⑤</text>
<text x="696.0" y="228.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#334155" opacity="1.00">返回结果字符串</text>
<circle cx="678.0" cy="257.0" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="678.0" y="260.2" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">⑥</text>
<text x="696.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#334155" opacity="1.00">打印到屏幕</text>
<text x="60.0" y="474.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#b91c1c" opacity="1.00">从 AI 出来的箭头只有一条，只通向程序，永远不直接通向文件系统。</text>
<text x="60.0" y="498.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569" opacity="1.00">AI 唯一能做的事，就是「输出一段 JSON 说我想要什么工具」。</text>
</svg>
