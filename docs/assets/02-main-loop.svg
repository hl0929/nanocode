<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" role="img" aria-label="主循环流程图：那个圈怎么转" style="background:#ffffff;max-width:100%;height:auto">
<title>主循环流程图：那个圈怎么转</title><desc>六行伪代码画成图：只有「有 tool_use」自环，和「没有 tool_use」出口两条箭头。</desc>
<style>
text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
.node rect.box, .node ellipse, .node polygon { filter: url(#soft); }
.flow { stroke-dasharray: 4 16; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}
</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.05" fill="#e2e8f0"/></pattern>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs><rect width="900" height="730" fill="#ffffff"/><rect width="900" height="730" fill="url(#dots)"/>
<g class="node"><rect class="box" x="250.0" y="56.0" width="260.0" height="46.0" rx="23" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#soft)"/>
<text x="380.0" y="83.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d4ed8">等你输入  ❯</text>
</g>
<g class="node"><rect class="box" x="250.0" y="140.0" width="260.0" height="58.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#soft)"/>
<text x="380.0" y="163.6" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d4ed8">messages += user</text>
<text x="380.0" y="183.8" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569">你说的话</text>
</g>
<g class="node"><rect class="box" x="250.0" y="238.0" width="260.0" height="62.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="380.0" y="263.6" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0e7490">call_api(...)</text>
<text x="380.0" y="283.9" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569">发：全部历史 + 工具菜单</text>
</g>
<g class="node"><rect class="box" x="250.0" y="336.0" width="260.0" height="56.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
<text x="380.0" y="358.6" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6d28d9">response.content</text>
<text x="380.0" y="378.9" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569">（block 列表）</text>
</g>
<g class="node"><polygon class="box" points="380.0,408.0 492.0,472.0 380.0,536.0 268.0,472.0" fill="#ffffff" stroke="#64748b" stroke-width="1.6" filter="url(#soft)"/>
<text x="380.0" y="466.9" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">里面有</text>
<text x="380.0" y="486.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569">tool_use 块？</text>
</g>
<marker id="arw-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<path d="M 380.0 102.0 L 380.0 140.0" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-user)"/>
<path d="M 380.0 102.0 L 380.0 140.0" fill="none" stroke="#eff6ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<marker id="arw-proc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
<path d="M 380.0 198.0 L 380.0 238.0" fill="none" stroke="#0891b2" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-proc)"/>
<path d="M 380.0 198.0 L 380.0 238.0" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<marker id="arw-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<path d="M 380.0 300.0 L 380.0 336.0" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-ai)"/>
<path d="M 380.0 300.0 L 380.0 336.0" fill="none" stroke="#f5f3ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<marker id="arw-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<path d="M 380.0 392.0 L 380.0 408.0" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-ink)"/>
<g class="node"><rect class="box" x="110.0" y="596.0" width="270.0" height="66.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="245.0" y="623.6" text-anchor="middle" font-size="13.5" font-weight="600" fill="#047857">run_tool 执行工具</text>
<text x="245.0" y="643.9" text-anchor="middle" font-size="13.5" font-weight="400" fill="#475569">打包成 tool_result</text>
</g>
<g class="node"><rect class="box" x="536.0" y="604.0" width="208.0" height="50.0" rx="25" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" filter="url(#soft)"/>
<text x="640.0" y="633.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#64748b">这轮回答结束</text>
</g>
<marker id="arw-fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<path d="M 380.0 536.0 L 380.0 596.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 380.0 536.0 L 380.0 596.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<rect x="392.0" y="560.2" width="84.8" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="396.0" y="573.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#047857">有 → 还要干活</text>
<path d="M 492.0 472.0 L 524.0 472.0 Q 536.0 472.0 536.0 484.0 L 536.0 604.0" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-ink)"/>
<rect x="544.0" y="448.2" width="96.3" height="19.6" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="548.0" y="461.9" text-anchor="start" font-size="11.5" font-weight="500" fill="#334155">没有 → 只想说话</text>
<path d="M 110.0 629.0 L 48.0 629.0 Q 36.0 629.0 36.0 617.0 L 36.0 181.0 Q 36.0 169.0 48.0 169.0 L 250.0 169.0" fill="none" stroke="#0891b2" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-proc)"/>
<path d="M 110.0 629.0 L 48.0 629.0 Q 36.0 629.0 36.0 617.0 L 36.0 181.0 Q 36.0 169.0 48.0 169.0 L 250.0 169.0" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<text x="60.0" y="428.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#475569" opacity="1.00">自环这两步：</text>
<text x="60.0" y="450.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#0e7490" opacity="1.00">① messages += assistant 原始块</text>
<text x="60.0" y="468.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#0e7490" opacity="1.00">② messages += user 工具结果</text>
<text x="60.0" y="490.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569" opacity="1.00">然后回到 call_api 再问一次</text>
<path d="M 744.0 629.0 L 800.0 629.0 Q 812.0 629.0 812.0 617.0 L 812.0 91.0 Q 812.0 79.0 800.0 79.0 L 510.0 79.0" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-user)"/>
<text x="828.0" y="363.9" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1d4ed8" transform="rotate(-90 828.0 360.0)">下一句话</text>
<rect x="556.0" y="200.0" width="240.0" height="112.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 5" fill-opacity="0.5"/>
<circle cx="570.0" cy="220.5" r="3.2" fill="#dc2626"/>
<text x="580.0" y="225.0" font-size="12.5" font-weight="700" fill="#b91c1c">两条箭头 = 全部逻辑</text>
<text x="574.0" y="250.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#b91c1c" opacity="1.00">自环：有 tool_use</text>
<text x="574.0" y="270.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#b91c1c" opacity="1.00">　　　→ 干活 → 再问一次</text>
<text x="574.0" y="292.0" text-anchor="start" font-size="12.0" font-weight="400" fill="#b91c1c" opacity="1.00">出口：没有 tool_use → 停</text>
</svg>
