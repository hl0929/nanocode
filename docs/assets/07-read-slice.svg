<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" role="img" aria-label="read 切片示意图：offset / limit 切哪几行" style="background:#ffffff;max-width:100%;height:auto">
<title>read 切片示意图：offset / limit 切哪几行</title><desc>offset 是 0 基下标，打印出来的行号却是 1 基 —— 差一行的地方就在这。</desc>
<style>
text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
.node rect.box, .node ellipse, .node polygon { filter: url(#soft); }
.flow { stroke-dasharray: 4 16; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}
</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.05" fill="#e2e8f0"/></pattern>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs><rect width="900" height="570" fill="#ffffff"/><rect width="900" height="570" fill="url(#dots)"/>
<text x="46.0" y="52.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a" opacity="1.00">① 原文件 lines：按行拆成的列表</text>
<g class="node"><rect class="box" x="46.0" y="64.0" width="54.0" height="34.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#soft)"/>
<text x="73.0" y="85.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">[0]</text>
</g>
<g class="node"><rect class="box" x="108.0" y="64.0" width="306.0" height="34.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#soft)"/>
<text x="124.0" y="85.7" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">import os</text>
</g>
<g class="node"><rect class="box" x="46.0" y="104.0" width="54.0" height="34.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#soft)"/>
<text x="73.0" y="125.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">[1]</text>
</g>
<g class="node"><rect class="box" x="108.0" y="104.0" width="306.0" height="34.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#soft)"/>
<text x="124.0" y="125.7" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">import sys</text>
</g>
<g class="node"><rect class="box" x="46.0" y="144.0" width="54.0" height="34.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="73.0" y="165.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">[2]</text>
</g>
<g class="node"><rect class="box" x="108.0" y="144.0" width="306.0" height="34.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="124.0" y="165.7" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">def main():</text>
</g>
<g class="node"><rect class="box" x="46.0" y="184.0" width="54.0" height="34.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="73.0" y="205.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">[3]</text>
</g>
<g class="node"><rect class="box" x="108.0" y="184.0" width="306.0" height="34.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="124.0" y="205.7" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">    pass</text>
</g>
<g class="node"><rect class="box" x="46.0" y="224.0" width="54.0" height="34.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="73.0" y="245.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">[4]</text>
</g>
<g class="node"><rect class="box" x="108.0" y="224.0" width="306.0" height="34.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="124.0" y="245.7" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">if __name__ == ...</text>
</g>
<g class="node"><rect class="box" x="46.0" y="264.0" width="54.0" height="34.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#soft)"/>
<text x="73.0" y="285.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">[5]</text>
</g>
<g class="node"><rect class="box" x="108.0" y="264.0" width="306.0" height="34.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#soft)"/>
<text x="124.0" y="285.7" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569">    return 0</text>
</g>
<rect x="38" y="138" width="382" height="126" rx="12" fill="none" stroke="#059669" stroke-width="2.2"/>
<marker id="arw-fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<path d="M 420.0 201.0 L 486.0 201.0" fill="none" stroke="#059669" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-fs)"/>
<path d="M 420.0 201.0 L 486.0 201.0" fill="none" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<text x="486.0" y="108.0" text-anchor="start" font-size="13.0" font-weight="700" fill="#0f172a" opacity="1.00">③ 每行前加行号 offset+idx+1</text>
<g class="node"><rect class="box" x="486.0" y="122.0" width="366.0" height="112.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
<text x="502.0" y="161.1" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569" class="mono">   3| def main():</text>
<text x="502.0" y="180.3" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569" class="mono">   4|     pass</text>
<text x="502.0" y="199.5" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569" class="mono">   5| if __name__ == ...</text>
</g>
<g class="node"><rect class="box" x="486.0" y="262.0" width="366.0" height="116.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" filter="url(#soft)"/>
<text x="502.0" y="299.1" text-anchor="start" font-size="12.0" font-weight="600" fill="#b45309" class="mono">输出行号 = offset + idx + 1</text>
<text x="502.0" y="321.9" text-anchor="start" font-size="12.0" font-weight="400" fill="#475569" class="mono">         = 2 + 0 + 1 = 3</text>
<text x="502.0" y="344.7" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569">idx = selected 里的下标，从 0 数</text>
</g>
<rect x="42.0" y="321.8" width="249.9" height="20.4" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="46.0" y="336.1" text-anchor="start" font-size="12.0" font-weight="500" fill="#047857">② lines[2 : 2+3]   offset=2, limit=3</text>
<g class="node"><rect class="box" x="46.0" y="420.0" width="400.0" height="76.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#soft)"/>
<text x="62.0" y="452.6" text-anchor="start" font-size="12.0" font-weight="600" fill="#b91c1c">⚠ offset 本身是 0 基，行号是 1 基</text>
<text x="62.0" y="470.6" text-anchor="start" font-size="11.5" font-weight="400" fill="#b91c1c">offset=2 → 显示第 3 行，AI 很容易错位一行</text>
</g>
<text x="46.0" y="528.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#64748b" opacity="1.00">虚线框 = 未选中，实线框 = 选中</text>
</svg>
