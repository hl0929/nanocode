<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-label="后端切换分支图" style="background:#ffffff;max-width:100%;height:auto">
<title>后端切换分支图</title><desc>一个环境变量决定认证头，两条分支最后汇到同一个 body。</desc>
<style>
text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace; }
.node rect.box, .node ellipse, .node polygon { filter: url(#soft); }
.flow { stroke-dasharray: 4 16; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}
</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.05" fill="#e2e8f0"/></pattern>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs><rect width="920" height="540" fill="#ffffff"/><rect width="920" height="540" fill="url(#dots)"/>
<g class="node"><polygon class="box" points="300.0,50.0 490.0,104.0 300.0,158.0 110.0,104.0" fill="#ffffff" stroke="#64748b" stroke-width="1.6" filter="url(#soft)"/>
<text x="300.0" y="108.2" text-anchor="middle" font-size="12.0" font-weight="600" fill="#0f172a">OPENROUTER_API_KEY 存在？</text>
</g>
<g class="node"><rect class="box" x="40.0" y="220.0" width="380.0" height="132.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
<text x="56.0" y="260.4" text-anchor="start" font-size="13.5" font-weight="600" fill="#6d28d9">OpenRouter 分支</text>
<text x="56.0" y="280.6" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">URL    openrouter.ai/api/v1/messages</text>
<text x="56.0" y="296.4" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">MODEL  anthropic/claude-opus-4.5</text>
<text x="56.0" y="312.1" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">HDR    Authorization: Bearer</text>
</g>
<marker id="arw-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<path d="M 220.0 158.0 L 220.0 220.0" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-ai)"/>
<path d="M 220.0 158.0 L 220.0 220.0" fill="none" stroke="#f5f3ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<rect x="232.0" y="192.7" width="19.0" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="236.0" y="205.7" text-anchor="start" font-size="11.0" font-weight="500" fill="#6d28d9">有</text>
<g class="node"><rect class="box" x="500.0" y="220.0" width="380.0" height="132.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6" filter="url(#soft)"/>
<text x="516.0" y="260.4" text-anchor="start" font-size="13.5" font-weight="600" fill="#0e7490">Anthropic 官方分支</text>
<text x="516.0" y="280.6" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">URL    api.anthropic.com/v1/messages</text>
<text x="516.0" y="296.4" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">MODEL  claude-opus-4-5</text>
<text x="516.0" y="312.1" text-anchor="start" font-size="10.5" font-weight="400" fill="#475569">HDR    x-api-key</text>
</g>
<marker id="arw-proc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
<path d="M 490.0 104.0 L 678.0 104.0 Q 690.0 104.0 690.0 116.0 L 690.0 220.0" fill="none" stroke="#0891b2" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-proc)"/>
<path d="M 490.0 104.0 L 678.0 104.0 Q 690.0 104.0 690.0 116.0 L 690.0 220.0" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<rect x="702.0" y="176.7" width="30.0" height="18.7" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="none"/><text x="706.0" y="189.7" text-anchor="start" font-size="11.0" font-weight="500" fill="#0e7490">没有</text>
<g class="node"><rect class="box" x="250.0" y="400.0" width="420.0" height="64.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" filter="url(#soft)"/>
<text x="460.0" y="426.8" text-anchor="middle" font-size="13.0" font-weight="600" fill="#b45309">同一个 body 结构</text>
<text x="460.0" y="446.3" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">{model, system, messages, tools}</text>
</g>
<path d="M 230.0 352.0 L 230.0 364.0 Q 230.0 376.0 242.0 376.0 L 388.0 376.0 Q 400.0 376.0 400.0 388.0 L 400.0 400.0" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-ai)"/>
<path d="M 230.0 352.0 L 230.0 364.0 Q 230.0 376.0 242.0 376.0 L 388.0 376.0 Q 400.0 376.0 400.0 388.0 L 400.0 400.0" fill="none" stroke="#f5f3ff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<path d="M 690.0 352.0 L 690.0 364.0 Q 690.0 376.0 678.0 376.0 L 532.0 376.0 Q 520.0 376.0 520.0 388.0 L 520.0 400.0" fill="none" stroke="#0891b2" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.00" marker-end="url(#arw-proc)"/>
<path d="M 690.0 352.0 L 690.0 364.0 Q 690.0 376.0 678.0 376.0 L 532.0 376.0 Q 520.0 376.0 520.0 388.0 L 520.0 400.0" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linecap="round" opacity=".95" class="flow"/>
<text x="460.0" y="492.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b" opacity="1.00">→ urlopen → json.loads → 返回同样的 {'content': [...]}</text>
<text x="40.0" y="470.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#475569" opacity="1.00">分支只在这里出现一次</text>
<text x="40.0" y="492.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#475569" opacity="1.00">main() 完全不用关心后端</text>
</svg>
